name: Deploy Terraform to GCP

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: k-candidate/gha-workflows/.github/workflows/deployment-pipeline.yaml@main
    with:
      project_id: ${{ secrets.GCP_PROJECT_ID }}
      region: "us-east1"
      service_account_key: ${{ secrets.GCP_SA_KEY }}
      terraform_directory: "."
